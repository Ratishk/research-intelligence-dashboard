# Optional FreshRSS backbone for scaling the ~290 RSS/newsletter feeds.
# The app runs fine without this (direct feedparser ingestion is the default);
# set FRESHRSS_* in .env to route RSS through FreshRSS instead.
services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: research-freshrss
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=UTC
      - CRON_MIN=*/15
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions

volumes:
  freshrss_data:
  freshrss_extensions:
